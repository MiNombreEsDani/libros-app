name: Bot de libros

on:
  schedule:
    - cron: "*/5 * * * *"        # cada 5 minutos (GitHub puede retrasarlo un poco)
  workflow_dispatch:              # botón "Run workflow" para lanzarlo a mano
  repository_dispatch:
    types: [pedido]               # la app lo despierta al momento si hay token configurado

concurrency:
  group: bot-libros               # nunca dos rondas a la vez
  cancel-in-progress: false

permissions:
  contents: read
  actions: write                  # para mantener activa la programación (ver último paso)

jobs:
  ronda:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CONFIG_BOT: ${{ secrets.CONFIG_BOT }}
    steps:
      - name: ¿Está configurado?
        if: env.CONFIG_BOT == ''
        run: echo "Falta el secreto CONFIG_BOT (ejecuta preparar_nube.bat en el ordenador). No hago nada."
      - uses: actions/checkout@v4
        if: env.CONFIG_BOT != ''
      - uses: actions/setup-python@v5
        if: env.CONFIG_BOT != ''
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - run: pip install -r worker/requirements.txt
        if: env.CONFIG_BOT != ''
      - name: Ronda del bot
        if: env.CONFIG_BOT != ''
        run: python worker/bot_nube.py
      - name: Mantener activa la programación
        # GitHub pausa las tareas programadas tras 60 días sin cambios en el repositorio.
        if: always() && github.event_name == 'schedule'
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/bot.yml/enable" || true
        env:
          GH_TOKEN: ${{ github.token }}
