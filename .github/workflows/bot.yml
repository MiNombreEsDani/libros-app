name: Bot de libros

# Lo despierta Supabase: al momento cuando hay un pedido o un usuario nuevo,
# y una vez al día (pg_cron) para revisar el grupo y reintentar envíos.
on:
  workflow_dispatch:              # botón "Run workflow" para lanzarlo a mano
  repository_dispatch:
    types: [pedido]

concurrency:
  group: bot-libros               # nunca dos rondas a la vez
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ronda:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CONFIG_BOT: ${{ secrets.CONFIG_BOT }}
    steps:
      - name: ¿Está configurado?
        if: env.CONFIG_BOT == ''
        run: echo "Falta el secreto CONFIG_BOT (ejecuta preparar_nube.bat en el ordenador). No hago nada."
      - uses: actions/checkout@v4
        if: env.CONFIG_BOT != ''
      - uses: actions/setup-python@v5
        if: env.CONFIG_BOT != ''
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - run: pip install -r worker/requirements.txt
        if: env.CONFIG_BOT != ''
      - name: Ronda del bot
        if: env.CONFIG_BOT != ''
        run: python worker/bot_nube.py
